name: Project 3 metadata cleanup

on:
  push:
    paths:
      - ".github/workflows/project3-synthetic-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove archive metadata
        run: |
          find Project3 -type f -name '._*' -delete
          grep -qxF '._*' Project3/.gitignore || sed -i '1a._*' Project3/.gitignore
      - name: Commit clean Project3 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Project3
          git diff --cached --quiet && exit 0
          git commit -m "Remove macOS archive metadata"
          git push
