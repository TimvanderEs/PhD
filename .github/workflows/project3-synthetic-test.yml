name: Apply verified Project3 enrichment release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract verified release
        run: |
          test -f project3_enrichment_8a8c28d.tar.gz
          tar -xzf project3_enrichment_8a8c28d.tar.gz Project3
          find Project3 -name '._*' -type f -delete
          rm project3_enrichment_8a8c28d.tar.gz
      - name: Commit release contents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FUMA MAGMA and gProfiler reproducibility package"
          git push
