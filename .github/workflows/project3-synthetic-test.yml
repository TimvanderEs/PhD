name: Apply verified Project3 release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract verified release
        run: |
          test -f project3_repo_update_1469be3.tar.gz
          tar -xzf project3_repo_update_1469be3.tar.gz
          rm project3_repo_update_1469be3.tar.gz
      - name: Commit release contents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LDSC LAVA and PLEIO reproducibility workflows"
          git push
