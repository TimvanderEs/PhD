name: Complete Project3 upload

on:
  push:
    branches:
      - main
    paths:
      - "Project3/phd_project3_payload.tar.gz"
      - ".github/workflows/bootstrap-project3-upload.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify and expand Project3 package
        run: |
          echo "0b359d9f4612c8c02a70761a8f49b698ff203c230aa61f7c3ab993abafa261a2  Project3/phd_project3_payload.tar.gz" | sha256sum --check
          tar -xzf Project3/phd_project3_payload.tar.gz
          rm Project3/phd_project3_payload.tar.gz
          rm .github/workflows/bootstrap-project3-upload.yml
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependency
        run: Rscript -e 'install.packages("data.table")'
      - name: Validate synthetic workflow
        run: bash Project3/tests/run_synthetic_test.sh
      - name: Commit Project3 package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Project3 .github/workflows
          git commit -m "Add Project3 directional PLEIO classification workflow"
          git push
